<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Insulink Übersicht</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@300..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #9DAEFF;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1350px; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.ground}}; color: {{t.text}}; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; font-variant-numeric: tabular-nums; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 52px 20px 0 20px">
    <button aria-label="Zeit seit letzter Messung: 2 Minuten 35 Sekunden" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 9px; border: 1px solid {{t.dockBorder}}; border-radius: 22px; box-sizing: border-box; background: {{t.panel}}; color: {{t.muted}}; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
      <svg width="26" height="26" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="{{t.line}}" stroke-width="3"></circle><circle cx="15" cy="15" r="12" fill="none" stroke="{{t.accent}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="39 76" transform="rotate(-90 15 15)"></circle></svg>
      <span>2:35</span>
    </button>
    <div style="display: flex; gap: 8px; align-items: center">
      <button aria-label="Pod-Status: verbunden" style="position: relative; width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid {{t.dockBorder}}; background: {{t.panel}}; color: {{t.text}}; display: grid; place-items: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7z"></path><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"></path></svg>
        <span aria-hidden="true" style="position: absolute; top: 1px; right: 1px; width: 10px; height: 10px; border-radius: 5px; background: {{t.range}}; box-shadow: 0 0 0 2.5px {{t.ground}}"></span>
      </button>
      <button aria-label="Sensorverbindung: verbunden" style="position: relative; width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid {{t.dockBorder}}; background: {{t.panel}}; color: {{t.text}}; display: grid; place-items: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7V3M15 7V3M6 7h12v4a6 6 0 0 1-12 0zM12 17v4"></path></svg>
        <span aria-hidden="true" style="position: absolute; top: 1px; right: 1px; width: 10px; height: 10px; border-radius: 5px; background: {{t.range}}; box-shadow: 0 0 0 2.5px {{t.ground}}"></span>
      </button>
      <button aria-label="Profil" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid {{t.dockBorder}}; background: {{t.accentSoft}}; color: {{t.accentText}}; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer">L</button>
    </div>
  </header>

  <section aria-label="Aktueller Glukosewert" style="padding: 20px 20px 0 20px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font-size: 124px; line-height: 0.8; font-weight: 800; letter-spacing: -0.055em; color: {{valueColor}}">{{value}}</span>
      <svg width="84" height="84" viewBox="2 2 20 20" fill="none" stroke="{{trendColor}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Trend: {{trendWord}}" style="flex: none; transform: rotate({{trendDeg}}deg)"><path d="M4.5 12h14M12.5 6l6 6-6 6"></path></svg>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; font-size: 15px; color: {{t.muted}}">
      <span>mg/dL</span>
      <span><span style="font-weight: 700; color: {{trendColor}}">{{trendWordCap}}</span> {{rate}} pro Min.</span>
    </div>

    <div aria-hidden="true" style="position: relative; height: 44px; margin-top: 22px">
      <div style="position: absolute; left: 0; right: 0; top: 13px; display: flex; gap: 4px; height: 5px">
        <span style="flex: 30; border-radius: 3px; background: {{t.low}}"></span>
        <span style="flex: 110; border-radius: 3px; background: {{t.range}}"></span>
        <span style="flex: 70; border-radius: 3px; background: {{t.high}}"></span>
      </div>
      <span style="position: absolute; top: 4px; left: {{markerLeft}}; width: 22px; height: 22px; margin-left: -11px; border-radius: 11px; background: {{t.text}}; box-shadow: 0 0 0 4px {{t.ground}}"></span>
      <span style="position: absolute; top: 10px; left: {{markerLeft}}; width: 10px; height: 10px; margin-left: -5px; border-radius: 5px; background: {{markerFill}}"></span>
      <span style="position: absolute; top: 30px; left: 14.3%; transform: translateX(-50%); font-size: 11px; color: {{t.muted}}">70</span>
      <span style="position: absolute; top: 30px; left: 66.7%; transform: translateX(-50%); font-size: 11px; color: {{t.muted}}">180</span>
    </div>
  </section>

  <section aria-labelledby="chart-h" style="padding: 18px 20px 0 20px">
    <a href="#" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; text-decoration: none">
      <span id="chart-h" style="font-size: 18px; font-weight: 700">Glukose</span>
      <span style="display: flex; align-items: center; gap: 2px; font-size: 14px; color: {{t.muted}}">24 Std.
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </span>
    </a>
    <svg width="350" height="168" viewBox="0 0 350 196" role="img" aria-label="Glukoseverlauf der letzten 24 Stunden" style="display: block; margin-top: 2px; overflow: visible">
      <defs>
        <clipPath id="cHigh"><rect x="-4" y="-10" width="360" height="54.7"></rect></clipPath>
        <clipPath id="cRange"><rect x="-4" y="44.7" width="360" height="98.5"></rect></clipPath>
        <clipPath id="cLow"><rect x="-4" y="143.2" width="360" height="40"></rect></clipPath>
      </defs>
      <line x1="0" x2="350" y1="44.7" y2="44.7" stroke="{{t.high}}" stroke-width="1" stroke-dasharray="2 4" opacity="0.7"></line>
      <line x1="0" x2="350" y1="143.2" y2="143.2" stroke="{{t.low}}" stroke-width="1" stroke-dasharray="2 4" opacity="0.7"></line>
      <path d="{{line}}" fill="none" stroke="{{t.high}}" stroke-width="2.5" stroke-linejoin="round" clip-path="url(#cHigh)"></path>
      <path d="{{line}}" fill="none" stroke="{{t.range}}" stroke-width="2.5" stroke-linejoin="round" clip-path="url(#cRange)"></path>
      <path d="{{line}}" fill="none" stroke="{{t.low}}" stroke-width="2.5" stroke-linejoin="round" clip-path="url(#cLow)"></path>
      <circle cx="350" cy="{{endY}}" r="6" fill="{{markerFill}}" stroke="{{t.ground}}" stroke-width="3"></circle>
      <text x="63" y="194" font-size="13" fill="{{t.muted}}" text-anchor="middle" font-family="inherit">4:00</text>
      <text x="158" y="194" font-size="13" fill="{{t.muted}}" text-anchor="middle" font-family="inherit">10:00</text>
      <text x="252" y="194" font-size="13" fill="{{t.muted}}" text-anchor="middle" font-family="inherit">16:00</text>
      <text x="345" y="194" font-size="13" fill="{{t.muted}}" text-anchor="end" font-family="inherit">jetzt</text>
    </svg>
  </section>

  <section aria-label="Zeit im Zielbereich, letzte 24 Stunden" style="margin: 22px 20px 0 20px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; align-items: baseline; gap: 10px">
        <span style="font-size: 30px; font-weight: 800; letter-spacing: -0.02em">87 %</span>
        <span style="font-size: 14px; color: {{t.muted}}">im Zielbereich, 24 Std.</span>
      </div>
      <div style="display: flex; gap: 12px; font-size: 13px; color: {{t.muted}}; padding-bottom: 4px">
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{t.low}}"></span>9 %</span>
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{t.high}}"></span>4 %</span>
      </div>
    </div>
    <div style="display: flex; gap: 3px; height: 6px" aria-hidden="true">
      <div style="flex: 9; border-radius: 3px; background: {{t.low}}"></div>
      <div style="flex: 87; border-radius: 3px; background: {{t.range}}"></div>
      <div style="flex: 4; border-radius: 3px; background: {{t.high}}"></div>
    </div>
  </section>

  <section aria-labelledby="dev-h" style="margin: 28px 12px 0 12px">
    <h2 id="dev-h" style="margin: 0 8px 10px 8px; font-size: 18px; font-weight: 700">Geräte</h2>
    <div style="padding: 16px 16px 2px 16px; border-radius: 20px; background: {{t.panel}}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <span style="font-size: 15px; font-weight: 700">Sensor</span>
            <span style="font-size: 14px; color: {{t.muted}}">noch 6 Tage</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px" aria-hidden="true">
            <sc-for list="{{days}}" as="d" hint-placeholder-count="10">
              <span style="display: block; height: 6px; border-radius: 3px; background: {{d.c}}"></span>
            </sc-for>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; justify-content: space-between; align-items: baseline">
              <span style="font-size: 15px; font-weight: 700">Pumpe</span>
              <span style="font-size: 14px; color: {{t.muted}}">noch 3 Tage</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px" aria-hidden="true">
              <span style="display: block; height: 6px; border-radius: 3px; background: {{t.accent}}"></span>
              <span style="display: block; height: 6px; border-radius: 3px; background: {{t.accent}}"></span>
              <span style="display: block; height: 6px; border-radius: 3px; background: {{t.accent}}"></span>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; justify-content: space-between; align-items: baseline">
              <span style="font-size: 15px; font-weight: 700">Reservoir</span>
              <span style="font-size: 14px; color: {{t.muted}}">47,6 E</span>
            </div>
            <div style="height: 6px; border-radius: 3px; background: {{t.line}}; overflow: hidden" aria-hidden="true">
              <span style="display: block; width: 95%; height: 6px; border-radius: 3px; background: {{t.accent}}"></span>
            </div>
          </div>
        </div>
      </div>
      <div style="height: 1px; background: {{t.line}}; margin-top: 16px"></div>
      <a href="#" style="display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 4px; text-decoration: none">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: {{t.range}}; flex: none" aria-hidden="true"></span>
        <span style="flex: 1; font-size: 15px; font-weight: 600">Automatische Abgabe aktiv</span>
        <span style="font-size: 15px; font-weight: 700">0,40 E/h</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </a>
    </div>
  </section>

  <section aria-labelledby="health-h" style="margin: 24px 12px 0 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; margin: 0 0 4px 8px">
      <h2 id="health-h" style="margin: 0; font-size: 18px; font-weight: 700">Heute</h2>
      <div style="display: flex">
        <button aria-label="Ansicht wechseln" style="width: 44px; height: 44px; border: none; background: transparent; color: {{t.muted}}; display: grid; place-items: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg>
        </button>
        <button aria-label="Kacheln anpassen" style="width: 44px; height: 44px; border: none; background: transparent; color: {{t.muted}}; display: grid; place-items: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h16"></path><circle cx="9" cy="8" r="2.2" fill="{{t.ground}}"></circle><circle cx="15" cy="16" r="2.2" fill="{{t.ground}}"></circle></svg>
        </button>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="6">
        <a href="#" aria-label="{{s.aria}}" style="position: relative; display: flex; align-items: center; gap: 14px; min-height: 92px; padding: 0 14px 0 18px; box-sizing: border-box; border-radius: 22px; border: 1px solid {{t.dockBorder}}; background: {{t.panel}}; overflow: hidden; text-decoration: none">
          <sc-if value="{{s.hasGoal}}" hint-placeholder-val="{{ false }}">
            <span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: {{s.fill}}; background: {{t.accentSoft}}"></span>
          </sc-if>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{t.accent}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: relative; flex: none"><path d="{{s.icon}}"></path></svg>
          <span style="position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span style="font-size: 13px; color: {{t.muted}}">{{s.label}}</span>
            <span style="display: flex; align-items: baseline; gap: 4px; white-space: nowrap">
              <span style="font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">{{s.value}}</span>
              <span style="font-size: 14px; font-weight: 600; color: {{t.muted}}">{{s.unit}}</span>
            </span>
          </span>
        </a>
      </sc-for>
    </div>
  </section>

  <div style="height: 120px; flex: none" aria-hidden="true"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 16px 28px 16px; background: linear-gradient(to bottom, {{t.fade}}, {{t.ground}} 45%); display: flex; align-items: center; gap: 10px">
    <nav aria-label="Hauptnavigation" style="flex: 1; display: flex; align-items: center; justify-content: space-between; height: 62px; box-sizing: border-box; padding: 0 7px; border-radius: 31px; border: 1px solid {{t.dockBorder}}; background: {{t.dock}}; box-shadow: {{t.dockShadow}}">
      <a href="#" aria-current="page" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px 0 12px; border-radius: 24px; background: {{t.accentSoft}}; color: {{t.accentText}}; text-decoration: none; font-size: 14px; font-weight: 700">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>
        Übersicht
      </a>
      <a href="#" aria-label="Sport" style="display: grid; place-items: center; width: 48px; height: 48px; border-radius: 24px; color: {{t.muted}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="4.5" r="1.8"></circle><path d="M6 21l3.5-6 3 2.5V22M8 11l3-3.5 3.5 2.5 2.5 3h3M11 7.5l1.5 6"></path></svg>
      </a>
      <a href="#" aria-label="Ernährung" style="display: grid; place-items: center; width: 48px; height: 48px; border-radius: 24px; color: {{t.muted}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2v8a2 2 0 0 0 4 0V2M8 2v20M17 2c-2 1-3 4-3 8h3v12"></path></svg>
      </a>
      <a href="#" aria-label="Analyse" style="display: grid; place-items: center; width: 48px; height: 48px; border-radius: 24px; color: {{t.muted}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"></path></svg>
      </a>
    </nav>
    <a href="#" aria-label="Bolus abgeben" style="flex: none; display: grid; place-items: center; width: 62px; height: 62px; border-radius: 31px; background: {{t.accent}}; color: {{t.onAccent}}; box-shadow: {{t.dockShadow}}">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 2 4 4M16 4l4 4M19 5l-9.5 9.5M14 6l4 4-8.5 8.5H5.5v-4zM5.5 18.5 2 22M9 11l1.5 1.5M11.5 8.5 13 10"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"glucose":{"editor":"enum","options":["inRange","low"],"default":"inRange"},"$preview":{"width":390,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = {
      ground: '#0F1B26', line: '#26394B', text: '#EAF1F6', muted: '#97A9BA',
      accent: '#9DAEFF', onAccent: '#0F1B26', range: '#7CCB8F', high: '#F4B740', low: '#FF6B7F',
      lowSoft: 'rgba(255,107,127,0.14)', panel: '#152432',
      dock: '#1B2B3B', dockBorder: 'rgba(234,241,246,0.07)', dockShadow: '0 12px 32px rgba(0,0,0,0.45)',
      accentSoft: 'rgba(157,174,255,0.16)', accentText: '#C4CEFF', fade: 'rgba(15,27,38,0)'
    };
    var light = {
      ground: '#EDF2F6', line: '#D3DEE7', text: '#0F1B26', muted: '#4D6175',
      accent: '#3346C8', onAccent: '#FFFFFF', range: '#3B8A4F', high: '#A86A00', low: '#C8293F',
      lowSoft: 'rgba(200,41,63,0.10)', panel: '#FFFFFF',
      dock: '#FFFFFF', dockBorder: 'rgba(15,27,38,0.06)', dockShadow: '0 10px 28px rgba(15,27,38,0.12)',
      accentSoft: 'rgba(51,70,200,0.10)', accentText: '#2A3AA8', fade: 'rgba(237,242,246,0)'
    };
    var t = (this.props.theme ?? 'dark') === 'light' ? light : dark;
    var low = (this.props.glucose ?? 'inRange') === 'low';
    var current = low ? 64 : 137;

    var days = [];
    for (var i = 0; i < 10; i++) days.push({ c: i < 6 ? t.accent : t.line });

    var stats = [
      { label: 'Schritte', aria: 'Schritte: 4.208, 42 % vom Tagesziel', value: '4.208', unit: '', fill: '42%', hasGoal: true, icon: 'M13 4.5a1.5 1.5 0 1 0 0-.01M7 21l3-6 3 2.5V21M9 11l2.5-3 3 2.5 2 2.5h3M11.5 8l1.5 6' },
      { label: 'Gewicht', aria: 'Gewicht: 74,4 kg', value: '74,4', unit: 'kg', fill: '0%', icon: 'M12 3v18M7 21h10M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z' },
      { label: 'Herzfrequenz', aria: 'Herzfrequenz: 81 bpm', value: '81', unit: 'bpm', fill: '0%', icon: 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z' },
      { label: 'Schlaf', aria: 'Schlaf: 8 Stunden 16 Minuten', value: '8h 16m', unit: '', fill: '0%', icon: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z' },
      { label: 'Bolus', aria: 'Bolus heute: 2,1 Einheiten', value: '2,1', unit: 'E', fill: '0%', icon: 'm18 2 4 4M16 4l4 4M19 5l-9.5 9.5M14 6l4 4-8.5 8.5H5.5v-4zM5.5 18.5 2 22' },
