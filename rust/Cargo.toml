[package]
name = "rust_lib_insulink"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
# EC-JPAKE is implemented by hand (Juggluco-faithful) on RustCrypto primitives,
# NOT mbedTLS — the G7 uses a custom raw-point wire framing, not mbedTLS's
# TLS/ASN.1 round encoding. secp256r1 = p256.
p256 = { version = "0.13", features = ["arithmetic", "ecdsa"] }
sha2 = "0.11"
aes = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
# X25519 for the Omnipod DASH pairing handshake (see api/x25519.rs).
x25519-dalek = { version = "2", features = ["static_secrets"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
