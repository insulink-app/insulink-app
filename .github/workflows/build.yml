name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs to save CI minutes; let every main commit build to
# completion (cancelling mid-Gradle shows the older commit as a red "failed"
# run — exit 143 — when it was only superseded).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.44.2"

jobs:
  # ---------------------------------------------------------------------------
  # Fast checks: static analysis + Dart unit/widget tests. No Android toolchain
  # (no JDK/Gradle/Android-Rust target), so this finishes in ~1-2 min and gives
  # every PR quick feedback. It's the primary gate on PRs — the slow APK build
  # below runs only on main / manual.
  # ---------------------------------------------------------------------------
  verify:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # The pod protocol tests dlopen the host Rust core from
      # rust/target/debug/, so it has to exist before `flutter test`.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build (host)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust core (host)
        working-directory: rust
        run: cargo build

      - name: Test (with coverage)
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          # Public repos upload tokenless; add a CODECOV_TOKEN repo secret for
          # private repos or more reliable uploads, then uncomment:
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Rust crypto core: the J-PAKE KATs are the byte-exact contract vs Juggluco.
  # Fast, no Android toolchain needed (pure Rust / RustCrypto).
  # ---------------------------------------------------------------------------
  rust:
    name: Rust core (KATs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build
        working-directory: rust
        run: cargo build --verbose

      - name: Test (J-PAKE KATs)
        working-directory: rust
        run: cargo test --verbose

  # ---------------------------------------------------------------------------
  # Android app: cargokit compiles the Rust core for the Android target as part
  # of `flutter build apk`. arm64 single-ABI debug build is the fastest path
  # (see CLAUDE.md). This is the slow job, so it runs ONLY on pushes to main and
  # manual dispatch — PRs rely on `verify` + `rust` for fast feedback. To also
  # gate PRs on the APK build, drop the `if:` below.
  # ---------------------------------------------------------------------------
  android:
    name: Android (debug APK)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ubuntu-latest ships ~14 GB free; Flutter + Gradle + the multi-ABI Rust
      # build overruns it ("No space left on device"). Reclaim ~25 GB of
      # preinstalled toolchains we don't use before building.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          # Keep swap: the Rust crypto compile + Gradle daemon spike RAM, and
          # removing swap leaves no headroom → OOM-kill surfaces as a job that
          # is silently "canceled" mid-build.
          swap-storage: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        # cargokit adds the Android targets (e.g. aarch64-linux-android) via
        # rustup automatically during the Gradle build.

      - name: Cache cargo build (Android target)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK (arm64)
        # Cap cargo parallelism so peak RAM stays under the runner's limit
        # (concurrent codegen units are the memory spike that OOM-kills the job).
        env:
          CARGO_BUILD_JOBS: "2"
        run: flutter build apk --debug --target-platform android-arm64

      # Only kept for a manual run — a main-push APK is ~150 MB and the default
      # 90-day retention filled the account's artifact storage quota. The build
      # itself still gates every main push; it just doesn't store the output.
      - name: Upload APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-arm64
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Screenshots of the demo (docs/SCREENSHOTS.md): one runner per language and
  # theme, in parallel, each driving the demo in the runner's Chrome. The
  # web-demo job below publishes them with the demo under /screenshots/.
  # ---------------------------------------------------------------------------
  screenshots:
    name: Screenshots (${{ matrix.language }}, ${{ matrix.theme }})
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [de, en]
        theme: [dark, light]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Take screenshots
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          flutter drive --release -d web-server --browser-name=chrome \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/screenshots_test.dart \
            --browser-dimension=412x915@2 --dart-define=DEMO=true \
            --dart-define=LANGUAGE=${{ matrix.language }} --dart-define=THEME=${{ matrix.theme }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.language }}-${{ matrix.theme }}
          path: build/screenshots
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Browser demo for the website (docs/WEB_DEMO.md): every main push rebuilds it
  # from lib/main_demo.dart and publishes it to this repo's GitHub Pages, which
  # the website's hero loads in an iframe. The demo's screenshots ride along
  # under /screenshots/ (docs/SCREENSHOTS.md). The website repo holds no app code,
  # so this deploy IS the website update. Gated on `verify`, so a red build never
  # reaches the page. Needs Settings > Pages > Source: "GitHub Actions" once.
  # ---------------------------------------------------------------------------
  web-demo:
    name: Web demo (website)
    if: github.event_name != 'pull_request'
    needs: [verify, screenshots]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: web-demo
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Collects the four variants the screenshots job took in parallel.
      - name: Download screenshots
        uses: actions/download-artifact@v8
        with:
          pattern: screenshots-*
          path: build/screenshots
          merge-multiple: true

      # Served from https://insulink-app.github.io/insulink-app/, hence the base
      # href. canvaskit/ is dropped: the engine loads CanvasKit from gstatic by
      # default, so the 37 MB local copy would never be fetched.
      - name: Build web demo
        run: |
          flutter build web --release -t lib/main_demo.dart \
            --dart-define=DEMO=true --base-href /insulink-app/
          rm -rf build/web/canvaskit build/web/.last_build_id
          cp -r build/screenshots build/web/screenshots

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
