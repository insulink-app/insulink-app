name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.2"

jobs:
  # ---------------------------------------------------------------------------
  # Fast checks: static analysis + Dart unit/widget tests. No Android toolchain
  # (no JDK/Gradle/Android-Rust target), so this finishes in ~1-2 min and gives
  # every PR quick feedback. It's the primary gate on PRs — the slow APK build
  # below runs only on main / manual.
  # ---------------------------------------------------------------------------
  verify:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test (with coverage)
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          # Public repos upload tokenless; add a CODECOV_TOKEN repo secret for
          # private repos or more reliable uploads, then uncomment:
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Rust crypto core: the J-PAKE KATs are the byte-exact contract vs Juggluco.
  # Fast, no Android toolchain needed (pure Rust / RustCrypto).
  # ---------------------------------------------------------------------------
  rust:
    name: Rust core (KATs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build
        working-directory: rust
        run: cargo build --verbose

      - name: Test (J-PAKE KATs)
        working-directory: rust
        run: cargo test --verbose

  # ---------------------------------------------------------------------------
  # Android app: cargokit compiles the Rust core for the Android target as part
  # of `flutter build apk`. arm64 single-ABI debug build is the fastest path
  # (see CLAUDE.md). This is the slow job, so it runs ONLY on pushes to main and
  # manual dispatch — PRs rely on `verify` + `rust` for fast feedback. To also
  # gate PRs on the APK build, drop the `if:` below.
  # ---------------------------------------------------------------------------
  android:
    name: Android (debug APK)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        # cargokit adds the Android targets (e.g. aarch64-linux-android) via
        # rustup automatically during the Gradle build.

      - name: Cache cargo build (Android target)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK (arm64)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-arm64
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
